        let map;
        let markers = [];
        let markerCluster;

        function initMap() {
            const statusEl = document.getElementById('status');
            const statsEl = document.getElementById('stats');
            const toggleBtn = document.getElementById('toggleBtn');
            const infoPanel = document.getElementById('infoPanel');

            statusEl.textContent = '初始化地图...';

            map = new AMap.Map('container', {
                zoom: 11,
                center: [121.55, 31.22],
                mapStyle: 'amap://styles/dark',
                viewMode: '2D',
                showLabel: true,
                features: ['bg', 'road', 'building']
            });

            statusEl.textContent = '正在添加标记...';

            addMarkers();

            statusEl.innerHTML = `✓ 已标注 ${pools.length} 个游泳场所<br><small>点击标记查看详情</small>`;
            statsEl.style.display = 'block';
            statsEl.innerHTML = `
                数据来源：浦东新区游泳场所名单<br>
                更新时间：2026年7月
            `;

            toggleBtn.style.display = 'block';

            // 切换面板显示
            let panelVisible = true;
            toggleBtn.addEventListener('click', function() {
                panelVisible = !panelVisible;
                infoPanel.style.opacity = panelVisible ? '1' : '0';
                infoPanel.style.pointerEvents = panelVisible ? 'auto' : 'none';
                toggleBtn.textContent = panelVisible ? '隐藏面板' : '显示面板';
            });
        }

        function addMarkers() {
            pools.forEach((pool) => {
                const marker = new AMap.Marker({
                    position: [pool.lng, pool.lat],
                    title: pool.name,
                    icon: new AMap.Icon({
                        size: new AMap.Size(24, 24),
                        image: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIxMiIgY3k9IjEyIiByPSI5IiBmaWxsPSIjMzhCREY4Ii8+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iNiIgZmlsbD0id2hpdGUiLz48Y2lyY2xlIGN4PSIxMiIgY3k9IjEyIiByPSIzIiBmaWxsPSIjMzhCREY4Ii8+PC9zdmc+',
                        imageSize: new AMap.Size(24, 24)
                    })
                });

                const infoWindow = new AMap.InfoWindow({
                    content: `<div style="padding: 12px; min-width: 220px; max-width: 320px;">
                        <div class="marker-title">${pool.name}</div>
                        <div class="marker-address">${pool.address}</div>
                    </div>`,
                    offset: new AMap.Pixel(0, -30)
                });

                marker.on('click', function() {
                    infoWindow.open(map, marker.getPosition());
                });

                map.add(marker);
                markers.push(marker);
            });

            // 自动调整视野以显示所有标记
            setTimeout(() => {
                map.setFitView(null, false, [80, 80, 80, 80]);
            }, 100);
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMap);
        } else {
            initMap();
        }
    </script>
