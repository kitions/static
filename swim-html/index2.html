var listEl=document.getElementById("list");
var searchEl=document.getElementById("search");
var statusEl=document.getElementById("status");
function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function navUrl(p){return "https://uri.amap.com/marker?position="+p.lng+","+p.lat+"&name="+encodeURIComponent(p.name)+"&coordinate=gaode&callnative=1"}
if(!window.AMap){document.getElementById("error").className="error show"}else{
  var map=new AMap.Map("map",{resizeEnable:true,zoom:11,center:[121.62,31.17]});
  var infoWindow=new AMap.InfoWindow({offset:new AMap.Pixel(0,-30)});
  var markers={};
  places.forEach(function(p){
    var marker=new AMap.Marker({map:map,position:[p.lng,p.lat],title:p.name});
    marker.on("click",function(){showPlace(p)});
    markers[p.id]=marker;
  });
  function infoContent(p){return '<div style="padding:4px;min-width:230px"><div style="font-size:16px;font-weight:600;margin-bottom:6px">'+escapeHtml(p.name)+'</div><div style="font-size:12px;color:#666;line-height:1.5">'+escapeHtml(p.address)+'</div><a href="'+navUrl(p)+'" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;color:#1677ff;text-decoration:none">在高德地图中打开 →</a></div>'}
  function showPlace(p){
    var old=document.querySelector(".item.active");if(old)old.className="item";
    var item=document.querySelector('.item[data-id="'+p.id+'"]');if(item){item.className="item active";item.scrollIntoView({block:"nearest"})}
    map.setZoomAndCenter(16,[p.lng,p.lat]);
    infoWindow.setContent(infoContent(p));infoWindow.open(map,[p.lng,p.lat]);
    document.getElementById("sidebar").className="sidebar";
  }
  function render(items){
    listEl.innerHTML="";statusEl.textContent="显示 "+items.length+" 个场所";
    items.forEach(function(p){var li=document.createElement("li");li.className="item";li.setAttribute("data-id",p.id);li.innerHTML='<div class="name">'+p.id+'. '+escapeHtml(p.name)+'</div><div class="address">'+escapeHtml(p.address)+'</div>';li.onclick=function(){showPlace(p)};listEl.appendChild(li)});
    places.forEach(function(p){markers[p.id].setMap(items.indexOf(p)>=0?map:null)});
    var visible=items.map(function(p){return markers[p.id]});if(visible.length){map.setFitView(visible,false,[50,50,50,50],13)}
  }
  searchEl.oninput=function(){var q=searchEl.value.trim().toLowerCase();render(places.filter(function(p){return(p.name+" "+p.address).toLowerCase().indexOf(q)>=0}))};
  document.getElementById("mobile").onclick=function(){var side=document.getElementById("sidebar");side.className=side.className==="sidebar open"?"sidebar":"sidebar open"};
  render(places);
}
</script>
