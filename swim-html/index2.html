  places.forEach(function(p){var marker=new AMap.Marker({map:map,position:[p.lng,p.lat],title:p.name,offset:new AMap.Pixel(-8,-8),content:'<span class="pool-marker" data-marker="'+p.id+'"></span>'});marker.on("click",function(){showPlace(p,true)});markers[p.id]=marker});
  function infoContent(p){return '<div class="info-card"><div class="info-title">'+escapeHtml(p.name)+'</div><div class="info-address">'+escapeHtml(p.address)+'</div><a class="info-link" href="'+navUrl(p)+'" target="_blank" rel="noopener">在高德地图中打开 ↗</a></div>'}
  function setActive(p){document.querySelectorAll(".item.active,.pool-marker.selected").forEach(function(el){el.classList.remove("active","selected")});activeId=p.id;var item=document.querySelector('.item[data-id="'+p.id+'"]');if(item){item.classList.add("active");item.scrollIntoView({block:"nearest",behavior:"smooth"})}var pin=document.querySelector('[data-marker="'+p.id+'"]');if(pin)pin.classList.add("selected")}
  function showPlace(p,fromMarker){setActive(p);if(!fromMarker)map.setZoomAndCenter(16,[p.lng,p.lat]);infoWindow.setContent(infoContent(p));infoWindow.open(map,[p.lng,p.lat]);sidebar.classList.remove("open")}
  function fitView(items){var shown=items.map(function(p){return markers[p.id]});if(shown.length)map.setFitView(shown,false,[56,56,56,56],12)}
  function render(items,shouldFit){visiblePlaces=items;listEl.innerHTML="";statusEl.textContent="显示 "+items.length+" 个场所";countEl.textContent=items.length;items.forEach(function(p){var li=document.createElement("li");li.className="item"+(p.id===activeId?" active":"");li.dataset.id=p.id;li.innerHTML='<span class="item-number">'+p.id+'</span><div class="name">'+escapeHtml(p.name)+'</div><div class="address">'+escapeHtml(p.address)+'</div>';li.addEventListener("click",function(){showPlace(p)});listEl.appendChild(li)});if(!items.length)listEl.innerHTML='<li class="empty">没有匹配的场所<br>换个关键词试试</li>';places.forEach(function(p){markers[p.id].setMap(items.indexOf(p)>-1?map:null)});if(shouldFit)fitView(items)}
  function applySearch(){var q=searchEl.value.trim().toLowerCase();clearSearch.classList.toggle("visible",!!q);render(places.filter(function(p){return(p.name+" "+p.address+" "+p.matchedPoi).toLowerCase().indexOf(q)>-1}),true)}
  searchEl.addEventListener("input",applySearch);clearSearch.addEventListener("click",function(){searchEl.value="";searchEl.focus();applySearch()});
  function resetView(){searchEl.value="";applySearch();infoWindow.close()}
  document.getElementById("fitAll").addEventListener("click",resetView);document.getElementById("fitAllMap").addEventListener("click",function(){fitView(visiblePlaces)});
  document.getElementById("mobile").addEventListener("click",function(){sidebar.classList.toggle("open")});
  render(places,true);
}
</script>
</body>
</html>
